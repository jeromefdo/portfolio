    <!-- Footer -->

      <div class="max-w-7xl mx-auto text-center text-slate-500 text-sm">
        &copy; 2024 Jerome Fernando. All rights reserved. Let's build something.
      </div>
    </footer>

    <script>
  const roles = [
  "scalable web apps",
  "data-driven solutions",
  "seamless user experiences",
  "clean business logic"
];
  
  let roleIndex = 0;
  let charIndex = 0;
  let isDeleting = false;

  function typeRole() {
    const currentRole = roles[roleIndex];
    const targetEl = document.getElementById("typed-role");

    if (isDeleting) {
      targetEl.textContent = currentRole.substring(0, charIndex - 1);
      charIndex--;
    } else {
      targetEl.textContent = currentRole.substring(0, charIndex + 1);
      charIndex++;
    }

    let delay = isDeleting ? 40 : 80;

    if (!isDeleting && charIndex === currentRole.length) {
      delay = 2000; // Pause at full title
      isDeleting = true;
    } else if (isDeleting && charIndex === 0) {
      isDeleting = false;
      roleIndex = (roleIndex + 1) % roles.length;
      delay = 300; // Pause before typing next
    }

    setTimeout(typeRole, delay);
  }

  document.addEventListener("DOMContentLoaded", typeRole);
</script>
  </body>
</html>
